<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131A" />
      <stop offset="100%" stop-color="#08080C" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25F4EE" />
      <stop offset="100%" stop-color="#00D2C4" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FE2C55" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Sticker outline effect / peel corner -->
  <path d="M96 24 H36 C29.37 24 24 29.37 24 36 V92 C24 98.63 29.37 104 36 104 H92 C98.63 104 104 98.63 104 92 V32 L96 24 Z" fill="#181A22" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  
  <!-- Folded sticker peel -->
  <path d="M104 40 L88 24 L88 36 C88 38.2 89.8 40 92 40 H104 Z" fill="#25F4EE" opacity="0.85" />

  <!-- TikTok Glitch Music Note / Sticker Symbol -->
  <!-- Cyan offset -->
  <g transform="translate(14, 18)" opacity="0.9">
    <path d="M48 20 C52 25 57 28 64 29 V37 C58 37 53 34 49 30 V52 C49 61.94 40.94 70 31 70 C21.06 70 13 61.94 13 52 C13 42.06 21.06 34 31 34 C33.2 34 35.3 34.4 37.2 35.1 V43.5 C35.4 42.6 33.3 42.1 31 42.1 C25.53 42.1 21.1 46.53 21.1 52 C21.1 57.47 25.53 61.9 31 61.9 C36.47 61.9 40.9 57.47 40.9 52 V20 H48 Z" fill="#25F4EE" />
  </g>

  <!-- Red / Pink offset -->
  <g transform="translate(18, 22)" opacity="0.9">
    <path d="M48 20 C52 25 57 28 64 29 V37 C58 37 53 34 49 30 V52 C49 61.94 40.94 70 31 70 C21.06 70 13 61.94 13 52 C13 42.06 21.06 34 31 34 C33.2 34 35.3 34.4 37.2 35.1 V43.5 C35.4 42.6 33.3 42.1 31 42.1 C25.53 42.1 21.1 46.53 21.1 52 C21.1 57.47 25.53 61.9 31 61.9 C36.47 61.9 40.9 57.47 40.9 52 V20 H48 Z" fill="#FE2C55" />
  </g>

  <!-- Main White note overlay -->
  <g transform="translate(16, 20)">
    <path d="M48 20 C52 25 57 28 64 29 V37 C58 37 53 34 49 30 V52 C49 61.94 40.94 70 31 70 C21.06 70 13 61.94 13 52 C13 42.06 21.06 34 31 34 C33.2 34 35.3 34.4 37.2 35.1 V43.5 C35.4 42.6 33.3 42.1 31 42.1 C25.53 42.1 21.1 46.53 21.1 52 C21.1 57.47 25.53 61.9 31 61.9 C36.47 61.9 40.9 57.47 40.9 52 V20 H48 Z" fill="#FFFFFF" />
  </g>

  <!-- WhatsApp Verified Mini Badge in Bottom Right -->
  <circle cx="96" cy="96" r="14" fill="#22C55E" stroke="#12131A" stroke-width="3" />
  <path d="M91.5 96 L94.5 99 L100.5 93" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>